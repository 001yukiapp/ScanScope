<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache">
    <title>ScanScope 写真PoC</title>
    <script>
    // バージョン付きURLでキャッシュ無効化
    const _V = 'p0.1.0';
    if (!location.search.includes(_V)) location.replace(location.pathname + '?v=' + _V);
    </script>
    <style>
        * { box-sizing:border-box; margin:0; padding:0; }
        body { background:#111; color:#fff; font-family:-apple-system,sans-serif; padding:12px; line-height:1.6; }
        h1 { font-size:18px; margin-bottom:4px; }
        .ver { color:#555; font-size:12px; margin-bottom:12px; }
        .panel { background:#1c1c1e; border-radius:12px; padding:12px; margin-bottom:12px; }
        label { color:#888; font-size:13px; }
        input[type=number] { width:80px; padding:8px; border-radius:8px; border:1px solid #444; background:#222; color:#fff; font-size:15px; text-align:center; }
        button { background:#007aff; color:#fff; border:none; border-radius:11px; padding:12px 18px; font-size:15px; font-weight:600; margin-top:8px; }
        #photoInput { display:none; }
        canvas { width:100%; border-radius:10px; margin-top:8px; background:#000; }
        #log { background:#000; border-radius:10px; padding:10px; margin-top:12px; font-family:monospace; font-size:12px; white-space:pre-wrap; word-break:break-all; max-height:50vh; overflow-y:auto; }
        .big { font-size:15px; color:#34d058; font-weight:700; }
    </style>
</head>
<body>
    <h1>ScanScope 写真PoC</h1>
    <div class="ver">p0.1.0 — 写真1枚のタグ検出・px・距離・推定fxを確認</div>

    <div class="panel">
        <label>タグ黒部サイズ（mm・写すタグに合わせる）</label><br>
        <input id="sizeInput" type="number" value="199.42" min="5" max="500" step="0.1">
        <span style="color:#888;font-size:12px;">　床タグ=199.42 / ボス側面=55 / 上面=80</span>
        <br>
        <button id="pickBtn">📷 写真を撮る / 選ぶ</button>
        <input id="photoInput" type="file" accept="image/*" capture="environment">
    </div>

    <canvas id="canvas"></canvas>
    <div id="log">写真を選ぶと検出結果がここに出ます。\n（同じタグを「近距離」と「遠距離」で撮り比べると、写真がどこまで遠くのタグを拾えるか分かります）</div>

    <script src="./apriltag_wasm.js"></script>
    <script>
    const $ = id => document.getElementById(id);
    const canvas = $('canvas'), cctx = canvas.getContext('2d', { willReadFrequently:true });
    const logEl = $('log');
    let logText = '';
    function log(s){ logText = s + '\n' + logText; logEl.textContent = logText; }

    let detector = null;
    async function initDetector(){
        const Module = await AprilTagWasm();
        const _init   = Module.cwrap('atagjs_init','number',[]);
        const _setOpt = Module.cwrap('atagjs_set_detector_options','number',['number','number','number','number','number','number','number']);
        const _setPose= Module.cwrap('atagjs_set_pose_info','number',['number','number','number','number']);
        const _setBuf = Module.cwrap('atagjs_set_img_buffer','number',['number','number','number']);
        const _setSize= Module.cwrap('atagjs_set_tag_size',null,['number','number']);
        const _detect = Module.cwrap('atagjs_detect','number',[]);
        _init();
        _setOpt(1.0, 0.0, 1, 1, 0, 1, 1); // quad_decimate=1.0（精度優先・全解像度）
        detector = {
            set_camera_info: (fx,fy,cx,cy) => _setPose(fx,fy,cx,cy),
            set_tag_size: (id,sz) => _setSize(id,sz),
            detect: (g,w,h) => {
                const buf = _setBuf(w,h,w); Module.HEAPU8.set(g,buf);
                const ptr = _detect(); const len = Module.getValue(ptr,'i32');
                if (len === 0) return [];
                const sp = Module.getValue(ptr+4,'i32');
                const view = new Uint8Array(Module.HEAP8.buffer, sp, len);
                let j = ''; for (let i = 0; i < len; i++) j += String.fromCharCode(view[i]);
                return JSON.parse(j);
            }
        };
        log('✅ AprilTag WASM 初期化OK。写真を選んでください。');
    }
    initDetector().catch(e => log('❌ 初期化失敗: ' + e.message));

    // 隣接コーナー4辺の平均長（px）
    function edgePx(c){
        let s = 0;
        for (let i = 0; i < 4; i++){ const a = c[i], b = c[(i+1)%4]; s += Math.hypot(a[0]-b[0], a[1]-b[1]); }
        return s / 4;
    }

    $('pickBtn').onclick = () => $('photoInput').click();
    $('photoInput').onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const img = new Image();
        img.onload = () => { processImage(img); URL.revokeObjectURL(img.src); };
        img.onerror = () => log('❌ 画像読み込み失敗');
        img.src = URL.createObjectURL(file);
    };

    function processImage(img){
        if (!detector){ log('❌ detector未初期化'); return; }
        const W = img.naturalWidth, H = img.naturalHeight;
        canvas.width = W; canvas.height = H;
        cctx.drawImage(img, 0, 0, W, H);

        // 写真用fxの概算（動画1920幅でfx=1243 → 解像度比でスケール）。実値は要検証
        const fxEst = 1243 * W / 1920;
        detector.set_camera_info(fxEst, fxEst, W/2, H/2);
        const sizeM = (parseFloat($('sizeInput').value) || 199.42) / 1000;
        for (let id = 0; id < 60; id++) detector.set_tag_size(id, sizeM);

        const t0 = performance.now();
        const idata = cctx.getImageData(0, 0, W, H);
        const gray = new Uint8Array(W * H);
        for (let i = 0; i < gray.length; i++)
            gray[i] = (idata.data[i*4]*77 + idata.data[i*4+1]*151 + idata.data[i*4+2]*28) >> 8;
        let dets = [];
        try { dets = detector.detect(gray, W, H) || []; } catch(err){ log('❌ detect例外: ' + err.message); return; }
        const ms = Math.round(performance.now() - t0);

        // オーバーレイ描画
        cctx.lineWidth = Math.max(2, W/500);
        cctx.strokeStyle = '#34d058';
        cctx.fillStyle = '#34d058';
        cctx.font = `${Math.max(16, W/80)}px sans-serif`;
        for (const d of dets){
            const c = d.corners;
            cctx.beginPath(); cctx.moveTo(c[0][0], c[0][1]);
            for (let i = 1; i < 4; i++) cctx.lineTo(c[i][0], c[i][1]);
            cctx.closePath(); cctx.stroke();
            cctx.fillText('ID'+d.id, d.center[0], d.center[1]);
        }

        // 結果ログ
        log('────────────');
        log(`検出 ${dets.length}個 | 解像度 ${W}×${H} | 推定fx ${Math.round(fxEst)} | 処理 ${ms}ms`);
        dets.sort((a,b)=>a.id-b.id);
        for (const d of dets){
            const px = edgePx(d.corners).toFixed(1);
            let dist = '';
            if (d.pose && d.pose.t){
                const t = d.pose.t; const z = Array.isArray(t) ? t[2] : (t.z != null ? t.z : null);
                const norm = Array.isArray(t) ? Math.hypot(t[0],t[1],t[2]) : null;
                if (norm != null) dist = ` 距離${(norm*100).toFixed(0)}cm`;
            }
            log(`  ID${d.id}: 辺${px}px${dist}`);
        }
        log(`画像「${$('sizeInput').value}mm」設定で検出。辺pxが大きいほど精度に余裕（動画の側面検出限界は約70px）`);
    }
    </script>
</body>
</html>
