    <title>ScanScope Phase0 - AprilTag検証</title>
    <script>
    // バージョンが変わるとURLが変わり、キャッシュが自動で無効化される
    const _V = 'v0.4.0';

        location.replace(location.pathname + '?v=' + _V);
    }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #111; color: #fff;
            font-family: -apple-system, sans-serif;
            height: 100svh; overflow: hidden;
        }
        #start-screen {

        canvas#overlay { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        #panel {
            position: absolute; top: 12px; left: 12px; right: 12px;

            border-radius: 16px; padding: 14px 16px;

        .row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 14px; }
        .lbl { color: #888; }
        .val { font-weight: 600; }
        .good { color: #34d058; }
        .bad  { color: #ff6b6b; }
        .mid  { color: #ffd700; }
        #controls {
            position: absolute; bottom: 178px; left: 50%;
            transform: translateX(-50%);
            display: flex; gap: 12px;
        }
        #log-panel {
            position: absolute; bottom: 12px; left: 12px; right: 12px;
            background: rgba(0,0,0,0.75); backdrop-filter: blur(10px);
            border-radius: 16px; padding: 12px;
            height: 154px; overflow-y: auto;
            font-size: 11px; font-family: monospace; line-height: 1.5;
        }
        .entry { border-bottom: 1px solid #222; padding: 2px 0; }
        button {
            background: #007aff; color: #fff; border: none;
            border-radius: 12px; padding: 12px 22px;
            font-size: 15px; font-weight: 600; cursor: pointer;
            white-space: nowrap;
        }
        button.sec { background: rgba(80,80,80,0.9); }
        #loading {
            position: absolute; inset: 0; background: #111;
            display: none; flex-direction: column;
            align-items: center; justify-content: center; gap: 12px;
        }
        #loading p { color: #888; font-size: 14px; text-align: center; padding: 0 24px; line-height: 1.6; }
        .spinner {
            width: 36px; height: 36px;
            border: 3px solid #333; border-top-color: #007aff;
            border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="start-screen">
    <h1>ScanScope Phase0</h1>
    <p style="color:#555;font-size:12px;margin-bottom:4px;">v0.4.0</p>
    <p>AprilTag 36h11 マーカーの<br>認識テストアプリです。<br><br>後カメラを使用します。</p>
    <div style="display:flex;align-items:center;gap:8px;margin-top:4px;">
        <label style="color:#888;font-size:14px;">タグサイズ</label>
        <input id="tagSizeInput" type="number" value="40" min="5" max="200"
            style="width:70px;padding:6px;border-radius:8px;border:1px solid #444;background:#222;color:#fff;font-size:15px;text-align:center;">
        <span style="color:#888;font-size:14px;">mm</span>
    </div>
    <button id="startBtn">カメラ起動</button>
</div>

<div id="loading">
    <div class="spinner"></div>
    <p id="loading-msg">WASM読み込み中...<br>初回は10〜20秒かかります</p>
</div>

<div id="main">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>

    <div id="panel">
        <div class="row"><span class="lbl">検出状態</span><span class="val" id="s-status">初期化中</span></div>
        <div class="row"><span class="lbl">タグID</span><span class="val" id="s-id">-</span></div>
        <div class="row"><span class="lbl">推定距離</span><span class="val" id="s-margin">-</span></div>
        <div class="row"><span class="lbl">マーカーサイズ (px)</span><span class="val" id="s-size">-</span></div>
        <div class="row"><span class="lbl">FPS</span><span class="val" id="s-fps">-</span></div>
        <div class="row"><span class="lbl">検出率</span><span class="val" id="s-rate">-</span></div>
        <div class="row" style="border-top:1px solid #333;margin-top:4px;padding-top:6px;">
            <span class="lbl">相対ヨー（トー）</span>
            <span style="display:flex;align-items:baseline;gap:8px;">
                <span class="val" id="s-toe" style="font-size:20px;">-</span>
                <span style="font-size:11px;color:#888;">平均 <span id="s-toe-avg">-</span></span>
            </span>
        </div>
        <div class="row"><span class="lbl" style="font-size:11px;">タグ対 / ピッチ</span><span class="val" id="s-toepair" style="font-size:12px;">-</span></div>
        <div class="row"><span class="lbl" style="font-size:11px;">σ（ばらつき）</span><span class="val" id="s-toe-sd" style="font-size:12px;">-</span></div>
    </div>

    <!-- トーグラフ -->
    <div id="graph-wrap" style="
        position:absolute; left:12px; right:12px;
        top:320px;
        background:rgba(0,0,0,0.75); backdrop-filter:blur(10px);
        border-radius:16px; padding:10px 12px;
    ">
        <div style="display:flex;justify-content:space-between;font-size:11px;color:#888;margin-bottom:4px;">
            <span>トー時系列（10秒）</span>
            <span id="g-range">-</span>
        </div>
        <canvas id="toe-graph" height="80" style="width:100%;display:block;border-radius:8px;"></canvas>
    </div>

    <div id="controls" style="bottom:172px;">
        <button id="measureBtn">測定 5秒</button>
        <button id="recordBtn" class="sec">記録</button>
        <button class="sec" id="clearBtn">クリア</button>
    </div>

    <div id="log-panel" style="bottom:12px;height:120px;"></div>
</div>

<!-- AprilTag WASM（メインスレッド直実行） -->
<script src="./apriltag_wasm.js"></script>

<script>
const $ = id => document.getElementById(id);

const video   = $('video');
const overlay = $('overlay');
const ctx     = overlay.getContext('2d');
const logEl   = $('log-panel');

let detector = null;
let frameCount = 0, detectCount = 0, trialCount = 0;
let fps = 0, lastFpsTime = performance.now();

// ---- 重力ベクトル（DeviceMotion）----
// device frame の加速度を低域通過させて重力方向を抽出
let gravDev = { x: 0, y: 0, z: 0 };  // device frame
let gravOK = false;
const GRAV_ALPHA = 0.85;  // ローパス係数（大きいほど滑らか）

function onDeviceMotion(e) {
    const a = e.accelerationIncludingGravity;
    if (!a || a.x == null) return;
    gravDev.x = GRAV_ALPHA * gravDev.x + (1 - GRAV_ALPHA) * a.x;
    gravDev.y = GRAV_ALPHA * gravDev.y + (1 - GRAV_ALPHA) * a.y;
    gravDev.z = GRAV_ALPHA * gravDev.z + (1 - GRAV_ALPHA) * a.z;
    gravOK = true;
}

async function enableMotion() {
    try {
        // iOS 13+ は明示的な許可が必要（ユーザー操作内で呼ぶ）
        if (typeof DeviceMotionEvent !== 'undefined' &&
            typeof DeviceMotionEvent.requestPermission === 'function') {
            const res = await DeviceMotionEvent.requestPermission();
            if (res !== 'granted') return false;
        }
        window.addEventListener('devicemotion', onDeviceMotion);
        return true;
    } catch(e) {
        console.warn('motion permission error', e);
        return false;
    }
}

// device frame の重力 → camera frame へ変換
// iPhone portrait・背面カメラ:
//   camera: x=右, y=下, z=前方(シーン方向)  [OpenCV/AprilTag規約]
//   device: x=右, y=上, z=画面手前         [W3C規約]
//   → x_cam = x_dev, y_cam = -y_dev, z_cam = -z_dev
function gravityInCamera() {
    return { x: gravDev.x, y: -gravDev.y, z: -gravDev.z };
}

// オフスクリーンキャンバス（フレーム取得用）
const offscreen = document.createElement('canvas');
const offCtx    = offscreen.getContext('2d', { willReadFrequently: true });

// ---- 初期化 ----

async function init() {
    // 重力センサー許可（startBtnタップのユーザー操作内で呼ぶ必要あり）
    await enableMotion();

    $('start-screen').style.display = 'none';
    $('loading').style.display = 'flex';

    try {
        // WASMをメインスレッドで直接実行（Worker/Comlinkを使わない）
        $('loading-msg').textContent = 'WASM読み込み中...';
        const Module = await AprilTagWasm();

        const _init   = Module.cwrap('atagjs_init', 'number', []);
        const _setOpt = Module.cwrap('atagjs_set_detector_options', 'number',
                            ['number','number','number','number','number','number','number']);
        const _setPose = Module.cwrap('atagjs_set_pose_info', 'number',
                            ['number','number','number','number']);
        const _setBuf  = Module.cwrap('atagjs_set_img_buffer', 'number',
                            ['number','number','number']);
        const _setSize = Module.cwrap('atagjs_set_tag_size', null, ['number','number']);
        const _detect  = Module.cwrap('atagjs_detect', 'number', []);

        _init();
        _setOpt(2.0, 0.0, 1, 1, 0, 1, 1);

        detector = {
            set_camera_info: (fx, fy, cx, cy) => _setPose(fx, fy, cx, cy),
            set_tag_size:    (id, size) => _setSize(id, size),
            detect: (gray, w, h) => {
                const buf = _setBuf(w, h, w);
                Module.HEAPU8.set(gray, buf);
                const ptr = _detect();
                const len = Module.getValue(ptr, 'i32');
                if (len === 0) return [];
                const strPtr = Module.getValue(ptr + 4, 'i32');
                const view = new Uint8Array(Module.HEAP8.buffer, strPtr, len);
                let json = '';
                for (let i = 0; i < len; i++) json += String.fromCharCode(view[i]);
                return JSON.parse(json);
            }
        };

        $('loading-msg').textContent = 'カメラ起動中...';
        await startCamera();

    } catch(e) {
        $('loading').style.display = 'flex';
        $('loading-msg').textContent = 'エラー: ' + e.message;
        console.error(e);
    }
}

async function startCamera() {
    const stream = await navigator.mediaDevices.getUserMedia({
        video: {
            facingMode: { ideal: 'environment' },
            width:  { ideal: 1920 },
            height: { ideal: 1080 }
        },
        audio: false
    });
    video.srcObject = stream;
    await new Promise(r => { video.onloadedmetadata = r; });

    overlay.width  = video.videoWidth;
    overlay.height = video.videoHeight;

    // iPhone 14 Pro 後カメラ（広角）の近似内部パラメータ
    // 1920x1080 想定。fx≈fy≈1450, cx=960, cy=540
    // fx/fy: 実測キャリブレーション値（iPhone 14 Pro 広角、portrait）
    // 15cm@241px と 120cm@30px から逆算 → fx≈1243
    const cx = video.videoWidth  / 2;
    const cy = video.videoHeight / 2;
    detector.set_camera_info(1243, 1243, cx, cy);

    // タグサイズ設定（mm→m）、ID 0〜10に適用
    const tagSizeM = (parseFloat($('tagSizeInput').value) || 40) / 1000;
    for (let i = 0; i <= 10; i++) {
        detector.set_tag_size(i, tagSizeM);
    }

    $('loading').style.display = 'none';
    $('main').style.display = 'block';

    requestAnimationFrame(detectLoop);
}

// ---- 検出ループ ----

let errorShown = false;
function detectLoop() {
    try {
        // FPS計算
        frameCount++;
        const now = performance.now();
        if (now - lastFpsTime >= 1000) {
            fps = frameCount; frameCount = 0; lastFpsTime = now;
            $('s-fps').textContent = fps;
        }

        if (video.readyState >= 2) {
            runDetect();
        }
    } catch(e) {
        // 例外が出ても次フレームへ。最初の1回だけ画面に表示。
        if (!errorShown) {
            errorShown = true;
            addLog('ERR: ' + (e && e.stack ? e.stack : e));
        }
    } finally {
        // 何があってもループは止めない
        requestAnimationFrame(detectLoop);
    }
}

function runDetect() {
    // フレーム取得
    const W = video.videoWidth, H = video.videoHeight;
    offscreen.width = W; offscreen.height = H;
    offCtx.drawImage(video, 0, 0);
    const imageData = offCtx.getImageData(0, 0, W, H);

    // RGBA → グレースケール変換
    const gray = rgbaToGray(imageData);

    // 検出（同期・メインスレッド直実行）
    let detections = [];
    try {
        detections = detector.detect(gray, W, H) || [];
    } catch(e) {
        console.warn('detect error:', e);
    }

    trialCount++;

    // オーバーレイ描画
    ctx.clearRect(0, 0, overlay.width, overlay.height);

    if (detections.length > 0) {
        detectCount++;
        detections.forEach(d => drawTag(d));
        updateStats(detections[0]);
    } else {
        updateStatsNone();
    }

    // トー（2タグ相対角）— カメラ非依存
    try { updateToe(detections); } catch(e) { console.warn('toe error:', e); }

    const rate = trialCount > 0 ? Math.round(detectCount / trialCount * 100) : 0;
    $('s-rate').textContent = `${detectCount} / ${trialCount}  (${rate}%)`;
}

// RGBA → グレースケール（高速近似）
function rgbaToGray(imageData) {
    const { data, width, height } = imageData;
    const gray = new Uint8Array(width * height);
    for (let i = 0; i < gray.length; i++) {
        // ITU-R BT.601
        gray[i] = (data[i*4] * 77 + data[i*4+1] * 151 + data[i*4+2] * 28) >> 8;
    }
    return gray;
}

// ---- 描画 ----

function drawTag(d) {
    const c = d.corners;
    if (!c || c.length < 4) return;

    // 枠線
    ctx.strokeStyle = '#34d058';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(c[0].x, c[0].y);
    for (let i = 1; i < 4; i++) ctx.lineTo(c[i].x, c[i].y);
    ctx.closePath();
    ctx.stroke();

    // 中心点
    ctx.fillStyle = '#34d058';
    ctx.beginPath();
    ctx.arc(d.center.x, d.center.y, 6, 0, Math.PI * 2);
    ctx.fill();

    // IDラベル
    const labelX = c[0].x, labelY = c[0].y - 4;
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(labelX, labelY - 18, 56, 20);
    ctx.fillStyle = '#34d058';
    ctx.font = 'bold 13px -apple-system';
    ctx.fillText(`ID:${d.id}`, labelX + 4, labelY - 2);

    // 角番号（0=左上から時計回り）
    ctx.fillStyle = '#ff0';
    ctx.font = '11px monospace';
    c.forEach((pt, i) => ctx.fillText(i, pt.x + 4, pt.y - 3));

    // ポーズ情報があれば表示
    if (d.pose && d.pose.t) {
        const t = d.pose.t;
        const dist = Math.sqrt(t[0]**2 + t[1]**2 + t[2]**2) * 100; // m→cm
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px -apple-system';
        ctx.fillText(`${dist.toFixed(1)}cm`, d.center.x + 10, d.center.y);
    }
}

function updateStats(d) {
    const s = $('s-status');
    s.textContent = '✓ 検出中'; s.className = 'val good';
    $('s-id').textContent = `Tag #${d.id}`;

    const m = $('s-margin');
    if (d.pose && d.pose.t) {
        const t = d.pose.t;
        const dist = Math.sqrt(t[0]**2 + t[1]**2 + t[2]**2) * 100;
        m.textContent = dist.toFixed(1) + ' cm';
        m.className = 'val good';
    } else {
        m.textContent = '-';
        m.className = 'val';
    }

    if (d.corners) {
        const c = d.corners;
        const dx = c[1].x - c[0].x, dy = c[1].y - c[0].y;
        $('s-size').textContent = Math.round(Math.sqrt(dx*dx + dy*dy)) + ' px';
    }
}

// ---- トーグラフ ----
const TOE_BUF = 300;   // 10秒 × 30fps
const toeHistory = [];  // { t, v } の配列
const MA_WIN = 15;      // 移動平均ウィンドウ（フレーム数）

const gCanvas = $('toe-graph');
const gCtx    = gCanvas.getContext('2d');

function pushToeHistory(val) {
    toeHistory.push({ t: performance.now(), v: val });
    if (toeHistory.length > TOE_BUF) toeHistory.shift();
    drawToeGraph();
    updateToeStats();
}

function movingAvg(arr, i, win) {
    const start = Math.max(0, i - win + 1);
    let sum = 0;
    for (let j = start; j <= i; j++) sum += arr[j].v;
    return sum / (i - start + 1);
}

function drawToeGraph() {
    const cssW = gCanvas.offsetWidth || (window.innerWidth - 48);
    const W = cssW * window.devicePixelRatio;
    const H = 80 * window.devicePixelRatio;
    gCanvas.width  = W;
    gCanvas.height = H;

    const n = toeHistory.length;
    if (n < 2) return;

    // Y軸レンジ（自動、最低±3°）
    const vals = toeHistory.map(p => p.v);
    const mn = Math.min(...vals), mx = Math.max(...vals);
    const pad = Math.max((mx - mn) * 0.2, 3);
    const yMin = mn - pad, yMax = mx + pad;
    const yRange = yMax - yMin || 1;

    const toY = v => H - ((v - yMin) / yRange) * H;
    const toX = i => (i / (n - 1)) * W;

    // 背景
    gCtx.fillStyle = '#1a1a1a';
    gCtx.fillRect(0, 0, W, H);

    // ゼロライン
    const y0 = toY(0);
    gCtx.strokeStyle = '#333';
    gCtx.lineWidth = 1;
    gCtx.setLineDash([4, 4]);
    gCtx.beginPath(); gCtx.moveTo(0, y0); gCtx.lineTo(W, y0); gCtx.stroke();
    gCtx.setLineDash([]);

    // 生値
    gCtx.strokeStyle = '#1a6b3c';
    gCtx.lineWidth = 1;
    gCtx.beginPath();
    toeHistory.forEach((p, i) => {
        i === 0 ? gCtx.moveTo(toX(i), toY(p.v)) : gCtx.lineTo(toX(i), toY(p.v));
    });
    gCtx.stroke();

    // 移動平均
    gCtx.strokeStyle = '#34d058';
    gCtx.lineWidth = 2.5 * window.devicePixelRatio;
    gCtx.beginPath();
    toeHistory.forEach((_, i) => {
        const avg = movingAvg(toeHistory, i, MA_WIN);
        i === 0 ? gCtx.moveTo(toX(i), toY(avg)) : gCtx.lineTo(toX(i), toY(avg));
    });
    gCtx.stroke();

    // レンジ表示
    $('g-range').textContent = `${yMin.toFixed(1)}° 〜 ${yMax.toFixed(1)}°`;
}

function updateToeStats() {
    const n = toeHistory.length;
    if (n < 2) return;
    const vals = toeHistory.map(p => p.v);
    const avg = vals.reduce((s, v) => s + v, 0) / n;
    const sd  = Math.sqrt(vals.reduce((s, v) => s + (v - avg) ** 2, 0) / n);
    const lastAvg = movingAvg(toeHistory, n - 1, MA_WIN);

    $('s-toe-avg').textContent = lastAvg.toFixed(2) + '°';
    const sdEl = $('s-toe-sd');
    sdEl.textContent = '±' + sd.toFixed(2) + '°';
    sdEl.className = 'val ' + (sd < 1 ? 'good' : sd < 3 ? 'mid' : 'bad');
}

// ---- トー（2タグの相対角）の計算 ----
// 原理: 2つのタグの相対回転 R_A^T · R_B はカメラの動きが相殺され不変。
//   タグBの法線をタグAの座標系で表し、A基準の水平面(x-z)上の回転角を取る。
//   = 2輪の相対的な向きの差 = トーの本質。カメラを動かしても変わらないはず。
//
// AprilTagタグ座標系: x=右, y=下, z=法線(面の外向き)
//   → タグが垂直なホイールに付くと y軸=鉛直。x-z平面=水平。
//   → トー(ヨー) = A座標系でのBの法線の atan2(x, z)
//   → 相対ピッチ(キャンバー差) = atan2(y, z)
function updateToe(detections) {
    const toeEl   = $('s-toe');
    const pairEl  = $('s-toepair');
    const pitchEl = $('s-toepitch') || {};

    // pose.R を持つ検出だけ抽出、ID昇順で安定化
    const withPose = detections
        .filter(d => d.pose && d.pose.R)
        .sort((a, b) => a.id - b.id);

    if (withPose.length < 2) {
        toeEl.textContent = '2タグ必要';
        toeEl.className = 'val mid';
        pairEl.textContent = `検出 ${withPose.length} 個`;
        pitchEl.textContent = '-';
        return;
    }

    const A = withPose[0], B = withPose[1];
    const RA = A.pose.R, RB = B.pose.R;

    // Bの法線（カメラ座標）= RBの第3列
    const nB = [RB[0][2], RB[1][2], RB[2][2]];

    // A座標系へ: n_in_A = RA^T · nB  →  (RA^T)[i][j]=RA[j][i]
    const nA = [
        RA[0][0]*nB[0] + RA[1][0]*nB[1] + RA[2][0]*nB[2],
        RA[0][1]*nB[0] + RA[1][1]*nB[1] + RA[2][1]*nB[2],
        RA[0][2]*nB[0] + RA[1][2]*nB[1] + RA[2][2]*nB[2],
    ];

    const toeYaw   = Math.atan2(nA[0], nA[2]) * 180 / Math.PI; // 水平面の回転
    const toePitch = Math.atan2(nA[1], nA[2]) * 180 / Math.PI; // 鉛直面（キャンバー差）

    toeEl.textContent = toeYaw.toFixed(2) + '°';
    toeEl.className = 'val good';
    pairEl.textContent = `#${A.id} ↔ #${B.id} | ピッチ:${toePitch.toFixed(2)}°`;

    pushToeHistory(toeYaw);

    // 測定モード中ならサンプルを収集
    if (measuring) measureSamples.push(toeYaw);
}

// ---- 測定モード（5秒間の平均化）----
let measuring = false;
let measureSamples = [];

function startMeasure() {
    if (measuring) return;
    measuring = true;
    measureSamples = [];
    const btn = $('measureBtn');
    btn.style.background = '#ff3b30';

    const DURATION = 5000;
    const t0 = performance.now();

    const tick = () => {
        const elapsed = performance.now() - t0;
        const remain = Math.ceil((DURATION - elapsed) / 1000);
        if (elapsed < DURATION) {
            btn.textContent = `測定中 ${remain}`;
            setTimeout(tick, 200);
        } else {
            finishMeasure();
        }
    };
    tick();
}

function finishMeasure() {
    measuring = false;
    const btn = $('measureBtn');
    btn.style.background = '';
    btn.textContent = '測定 5秒';

    const n = measureSamples.length;
    if (n < 5) {
        addLog(`測定失敗: サンプル ${n}個（2タグを映し続けて）`);
        return;
    }
    const mean = measureSamples.reduce((s, v) => s + v, 0) / n;
    const sd = Math.sqrt(measureSamples.reduce((s, v) => s + (v - mean) ** 2, 0) / n);
    const sdMean = sd / Math.sqrt(n); // 平均値の標準誤差
    const mn = Math.min(...measureSamples);
    const mx = Math.max(...measureSamples);

    addLog(`★測定 平均 ${mean.toFixed(2)}° ±${sdMean.toFixed(3)}°（σ${sd.toFixed(2)} N=${n} 範囲${mn.toFixed(1)}〜${mx.toFixed(1)}）`);
}

function updateStatsNone() {
    const s = $('s-status');
    s.textContent = '✗ 未検出'; s.className = 'val bad';
    ['s-id', 's-margin', 's-size'].forEach(id => $(id).textContent = '-');
}

// ---- ボタン ----

$('startBtn').onclick = () => init();

$('measureBtn').onclick = () => startMeasure();

$('recordBtn').onclick = () => {
    const toe = $('s-toe').textContent;
    const avg = $('s-toe-avg').textContent;
    const sd  = $('s-toe-sd').textContent;
    const pair = $('s-toepair').textContent;
    addLog(`トー:${toe} 平均:${avg} σ:${sd} | ${pair} | FPS:${fps}`);
};

$('clearBtn').onclick = () => {
    logEl.innerHTML = '';
    detectCount = 0; trialCount = 0;
};

function addLog(msg) {
    const el = document.createElement('div');
    el.className = 'entry';
    el.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    logEl.prepend(el);
}
</script>
