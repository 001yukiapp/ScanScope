<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SS TileTest</title>
    <link rel="manifest" href="./manifest-tiletest.json">
    <meta name="theme-color" content="#111111">
    <link rel="apple-touch-icon" href="./icon.svg">
    <script>
    const APP_VERSION = 't0.2.0';
    const TOOL_KEY = 'tiletest';
    const VERSION_URL = 'https://001yukiapp.github.io/ScanScope/launch/version.json';
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background:#111; color:#fff; font-family:-apple-system,sans-serif; height:100svh; overflow:hidden; }
        #start-screen { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:0 24px; text-align:center; }
        #start-screen h1 { font-size:22px; }
        #start-screen p { color:#888; font-size:13px; line-height:1.7; }
        #main { position:absolute; inset:0; display:none; }
        video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
        canvas#overlay { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; pointer-events:none; }
        #panel { position:absolute; top:10px; left:10px; right:10px; background:rgba(0,0,0,0.78); backdrop-filter:blur(10px); border-radius:14px; padding:12px 14px; }
        .row { display:flex; justify-content:space-between; align-items:center; padding:3px 0; font-size:13px; }
        .lbl { color:#888; }
        .val { font-weight:600; }
        .big { font-size:20px; }
        .good { color:#34d058; } .bad { color:#ff6b6b; } .mid { color:#ffd700; }
        .barwrap { flex:1; height:8px; background:#333; border-radius:4px; margin:0 8px; overflow:hidden; }
        .bar { height:100%; width:0%; background:#34d058; transition:width .15s; }
        #verdict { position:absolute; left:10px; right:10px; top:120px; bottom:210px; background:rgba(0,0,0,0.92); backdrop-filter:blur(10px); border-radius:14px; padding:12px 14px; display:none; overflow-y:auto; }
        #verdict h2 { font-size:17px; margin-bottom:8px; }
        .id-row { display:grid; grid-template-columns:36px 1fr 52px 52px 52px 44px; gap:4px; align-items:center; font-size:12px; padding:4px 0; border-bottom:1px solid #222; }
        .id-row.header { color:#888; font-size:11px; border-bottom:1px solid #444; padding-bottom:6px; margin-bottom:2px; }
        #controls { position:absolute; bottom:168px; left:50%; transform:translateX(-50%); display:flex; gap:8px; flex-wrap:wrap; justify-content:center; width:96%; }
        #log-panel { position:absolute; bottom:10px; left:10px; right:10px; background:rgba(0,0,0,0.78); backdrop-filter:blur(10px); border-radius:14px; padding:10px; height:150px; overflow-y:auto; font-size:11px; font-family:monospace; line-height:1.5; }
        .entry { border-bottom:1px solid #222; padding:2px 0; }
        button { background:#007aff; color:#fff; border:none; border-radius:11px; padding:11px 16px; font-size:14px; font-weight:600; white-space:nowrap; }
        button.sec { background:rgba(80,80,80,0.9); }
        button.warn { background:#ff9500; }
        #loading { position:absolute; inset:0; background:#111; display:none; flex-direction:column; align-items:center; justify-content:center; gap:12px; }
        .spinner { width:36px; height:36px; border:3px solid #333; border-top-color:#007aff; border-radius:50%; animation:spin .8s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }
        input { width:60px; padding:6px; border-radius:8px; border:1px solid #444; background:#222; color:#fff; font-size:15px; text-align:center; }
        #qc-bar { height:6px; background:#333; border-radius:3px; margin-top:6px; overflow:hidden; display:none; }
        #qc-bar-fill { height:100%; width:0%; background:#ff9500; transition:width .1s; }
    </style>
</head>
<body>

<div id="start-screen">
    <h1>ScanScope タイル検品</h1>
    <p style="color:#555;">t0.2.0</p>
    <p>12枚を並べてカメラを全体にゆっくりかざす。<br>
       5秒間で全タグの合否を一括判定します。<br>
       足切りなし・キャリブなしの純粋な検出QCモード。</p>
    <div style="display:flex;align-items:center;gap:8px;">
        <label style="color:#888;font-size:13px;">タグ黒部</label>
        <input id="tagSizeInput" type="number" value="36" min="5" max="200">
        <span style="color:#888;font-size:13px;">mm</span>
    </div>
    <button id="startBtn">カメラ起動</button>
</div>

<div id="loading"><div class="spinner"></div><p id="loading-msg" style="color:#888;">WASM読み込み中...</p></div>

<div id="main">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>

    <div id="panel">
        <div class="row"><span class="lbl">現在見えてるタグ</span><span class="val big" id="s-visible">—</span></div>
        <div class="row"><span class="lbl">これまで検出したID</span><span class="val" id="s-found">—</span></div>
        <div id="qc-bar"><div id="qc-bar-fill"></div></div>
    </div>

    <div id="verdict"></div>

    <div id="controls">
        <button id="qcBtn" class="warn">検品5秒スタート</button>
        <button id="clrBtn" class="sec">リセット</button>
    </div>

    <div id="log-panel"></div>
</div>

<script src="./apriltag_wasm.js"></script>
<script>
const $ = id => document.getElementById(id);
const video = $('video'), overlay = $('overlay'), ctx = overlay.getContext('2d'), logEl = $('log-panel');
const offscreen = document.createElement('canvas');
const offCtx = offscreen.getContext('2d', { willReadFrequently:true });

let detector = null;

function getMargin(d){ const v = d.margin ?? d.decision_margin ?? d.dm ?? d.goodness; return (typeof v==='number')?v:null; }
function getHamming(d){ const v = d.hamming ?? d.h; return (typeof v==='number')?v:null; }
function poseR(d){ return (d.pose && d.pose.R) ? d.pose.R : null; }
function poseT(d){
    if(!d.pose || !d.pose.t) return null;
    const t=d.pose.t;
    return Array.isArray(t[0]) ? [t[0][0],t[1][0],t[2][0]] : [t[0],t[1],t[2]];
}
function tagPx(d){ const c=d.corners; let s=0; for(let i=0;i<4;i++){const a=c[i],b=c[(i+1)%4];s+=Math.hypot(b.x-a.x,b.y-a.y);} return s/4; }
function tiltDeg(R){ if(!R) return null; const nz=Math.abs(R[2][2]); return Math.acos(Math.max(0,Math.min(1,nz)))*180/Math.PI; }
function distCm(t){ if(!t) return null; return Math.hypot(t[0],t[1],t[2])*100; }
function marginColor(m){ if(m==null) return '#888'; if(m>=25) return '#34d058'; if(m>=12) return '#ffd700'; return '#ff6b6b'; }

// ID別の累積検出データ
// idStats[id] = { frames:0, hits:0, margins:[], hammings:[] }
// framesはQC中のフレーム数ではなく、そのIDが「見えた/見えなかった」を記録するためQCセッション管理で使う
let idStats = {};

// QC セッション
// qc = { t0, totalFrames, perFrame:[[id,...]] }
let qc = null;

async function init(){
    $('start-screen').style.display='none';
    $('loading').style.display='flex';
    try{
        const Module=await AprilTagWasm();
        const _init=Module.cwrap('atagjs_init','number',[]);
        const _setOpt=Module.cwrap('atagjs_set_detector_options','number',['number','number','number','number','number','number','number']);
        const _setPose=Module.cwrap('atagjs_set_pose_info','number',['number','number','number','number']);
        const _setBuf=Module.cwrap('atagjs_set_img_buffer','number',['number','number','number']);
        const _setSize=Module.cwrap('atagjs_set_tag_size',null,['number','number']);
        const _detect=Module.cwrap('atagjs_detect','number',[]);
        _init();
        _setOpt(1.0,0.0,1,1,0,1,1);
        detector={
            set_camera_info:(fx,fy,cx,cy)=>_setPose(fx,fy,cx,cy),
            set_tag_size:(id,sz)=>_setSize(id,sz),
            detect:(g,w,h)=>{
                const buf=_setBuf(w,h,w); Module.HEAPU8.set(g,buf);
                const ptr=_detect(); const len=Module.getValue(ptr,'i32');
                if(len===0) return [];
                const sp=Module.getValue(ptr+4,'i32');
                const view=new Uint8Array(Module.HEAP8.buffer,sp,len);
                let j=''; for(let i=0;i<len;i++) j+=String.fromCharCode(view[i]);
                return JSON.parse(j);
            }
        };
        $('loading-msg').textContent='カメラ起動中...';
        await startCamera();
    }catch(e){ $('loading-msg').textContent='エラー: '+e.message; console.error(e); }
}

async function startCamera(){
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
    video.srcObject=stream;
    await new Promise(r=>{video.onloadedmetadata=r;});
    overlay.width=video.videoWidth; overlay.height=video.videoHeight;
    detector.set_camera_info(1243,1243,video.videoWidth/2,video.videoHeight/2);
    const sz=(parseFloat($('tagSizeInput').value)||36)/1000;
    for(let i=0;i<=21;i++) detector.set_tag_size(i,sz);
    addLog(`起動 タグ黒部=${(sz*1000).toFixed(0)}mm`);
    $('loading').style.display='none';
    $('main').style.display='block';
    requestAnimationFrame(loop);
}

function loop(){
    try{ if(video.readyState>=2) process(); }catch(e){ console.warn(e); }
    finally{ requestAnimationFrame(loop); }
}

function process(){
    const W=video.videoWidth, H=video.videoHeight;
    offscreen.width=W; offscreen.height=H;
    offCtx.drawImage(video,0,0);
    const img=offCtx.getImageData(0,0,W,H);
    const gray=new Uint8Array(W*H);
    for(let i=0;i<gray.length;i++) gray[i]=(img.data[i*4]*77+img.data[i*4+1]*151+img.data[i*4+2]*28)>>8;

    let dets=[]; try{ dets=detector.detect(gray,W,H)||[]; }catch(e){}
    ctx.clearRect(0,0,W,H);

    const visibleIds = new Set();
    for(const d of dets){
        if(!d.corners) continue;
        const px=tagPx(d);
        drawTag(d, px);
        visibleIds.add(d.id);

        // QC中：ID別に集計
        if(qc){
            if(!qc.ids[d.id]) qc.ids[d.id]={ hits:0, margins:[], hammings:[] };
            qc.ids[d.id].hits++;
            const m=getMargin(d), ham=getHamming(d);
            if(m!=null) qc.ids[d.id].margins.push(m);
            if(ham!=null) qc.ids[d.id].hammings.push(ham);
        }
    }

    // ライブ表示
    $('s-visible').textContent = visibleIds.size > 0 ? `${visibleIds.size}枚` : '0枚';
    const allFound = Object.keys(idStats).sort((a,b)=>+a-+b);
    // QC外でも見えたIDを記録
    for(const id of visibleIds) if(!idStats[id]) idStats[id]=true;
    const foundIds = Object.keys(idStats).sort((a,b)=>+a-+b);
    $('s-found').textContent = foundIds.length ? `ID [${foundIds.join(', ')}]` : '—';

    if(qc){
        qc.totalFrames++;
        const elapsed = performance.now()-qc.t0;
        $('qc-bar-fill').style.width = Math.min(100, elapsed/5000*100)+'%';
        if(elapsed>=5000) finishQC();
    }
}

function drawTag(d, px){
    const c=d.corners, m=getMargin(d);
    const col=marginColor(m);
    ctx.strokeStyle=col; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(c[0].x,c[0].y);
    for(let i=1;i<4;i++) ctx.lineTo(c[i].x,c[i].y); ctx.closePath(); ctx.stroke();
    ctx.fillStyle=col; ctx.font='bold 18px -apple-system';
    ctx.fillText(`#${d.id}`, c[0].x+4, c[0].y-6);
}

function med(a){ if(!a.length) return null; const s=[...a].sort((x,y)=>x-y),n=s.length; return n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2; }

function startQC(){
    if(qc) return;
    qc={ t0:performance.now(), totalFrames:0, ids:{} };
    $('qcBtn').style.background='#ff3b30'; $('qcBtn').textContent='検品中…';
    $('qc-bar').style.display='block';
    $('qc-bar-fill').style.width='0%';
    $('verdict').style.display='none';
    addLog('★検品開始: カメラを全タイルにゆっくりかざして');
}

function finishQC(){
    const q=qc; qc=null;
    $('qcBtn').style.background=''; $('qcBtn').textContent='検品5秒スタート';
    $('qc-bar').style.display='none';

    const ids = Object.keys(q.ids).map(Number).sort((a,b)=>a-b);
    let passCount=0, failCount=0;

    let html = `<h2>検品結果 （${q.totalFrames}フレーム）</h2>`;
    html += `<div class="id-row header"><span>ID</span><span>検出率</span><span>margin<br>最小</span><span>margin<br>中央</span><span>hamming<br>最大</span><span>判定</span></div>`;

    for(const id of ids){
        const s=q.ids[id];
        const detRate = q.totalFrames ? s.hits/q.totalFrames*100 : 0;
        const mMin = s.margins.length ? Math.min(...s.margins) : null;
        const mMed = med(s.margins);
        const hamMax = s.hammings.length ? Math.max(...s.hammings) : null;

        let pass=true;
        if(detRate < 5) pass=false; // 5秒間でほぼ映らなかった
        if(hamMax!=null && hamMax>1) pass=false;

        if(pass) passCount++; else failCount++;

        const rateColor = detRate>=30?'good':(detRate>=10?'mid':'bad');
        const hamColor = hamMax===0?'good':(hamMax==null?'':'mid');

        html += `<div class="id-row">
            <span class="val">${id}</span>
            <span class="val ${rateColor}">${detRate.toFixed(0)}%</span>
            <span class="val" style="color:${marginColor(mMin)}">${mMin!=null?mMin.toFixed(0):'—'}</span>
            <span class="val" style="color:${marginColor(mMed)}">${mMed!=null?mMed.toFixed(0):'—'}</span>
            <span class="val ${hamColor}">${hamMax!=null?hamMax:'—'}</span>
            <span class="val ${pass?'good':'bad'}">${pass?'✅':'❌'}</span>
        </div>`;
    }

    if(ids.length===0){
        html += `<p class="bad" style="margin-top:8px;">一度も検出されませんでした</p>`;
    } else {
        html += `<div style="margin-top:8px;font-size:13px;color:#888;">合格 <span class="good">${passCount}</span> 枚 ／ 要確認 <span class="bad">${failCount}</span> 枚（検出IDのみ集計）</div>`;
        html += `<div style="margin-top:4px;font-size:11px;color:#555;">※検出率は5秒間の全フレームに対する割合。近〜遠・全体にかざしてください。</div>`;
    }

    $('verdict').innerHTML=html;
    $('verdict').style.display='block';
    addLog(`検品完了: ${ids.length}ID検出 合格${passCount} 要確認${failCount}`);
}

function reset(){
    idStats={};
    $('s-visible').textContent='—';
    $('s-found').textContent='—';
    $('verdict').style.display='none';
    addLog('リセット');
}

function addLog(msg){ const e=document.createElement('div'); e.className='entry'; e.textContent=`[${new Date().toLocaleTimeString()}] ${msg}`; logEl.prepend(e); }

$('startBtn').onclick=()=>init();
$('qcBtn').onclick=()=>startQC();
$('clrBtn').onclick=()=>reset();
</script>
<script>
(function(){
  const banner = document.createElement('div');
  banner.id = 'update-banner';
  Object.assign(banner.style, {
    display:'none', position:'fixed', bottom:'12px', left:'50%',
    transform:'translateX(-50%)', background:'#007aff', color:'#fff',
    borderRadius:'24px', padding:'12px 24px', fontSize:'14px',
    fontWeight:'600', zIndex:'9999', boxShadow:'0 4px 20px rgba(0,0,0,0.5)',
    cursor:'pointer', whiteSpace:'nowrap'
  });
  banner.textContent = '🆕 アップデートあり - タップして更新';
  document.body.appendChild(banner);
  let _reloading = false;
  banner.onclick = async () => {
    banner.textContent = '更新中...';
    if (navigator.serviceWorker && navigator.serviceWorker.controller) {
      navigator.serviceWorker.addEventListener('message', e => {
        if (e.data && e.data.type === 'UPDATE_DONE' && !_reloading) { _reloading = true; location.reload(); }
      });
      navigator.serviceWorker.controller.postMessage({ type: 'UPDATE_NOW' });
      setTimeout(() => { if (!_reloading) { _reloading = true; location.reload(); } }, 4000);
    } else { location.reload(); }
  };
  async function checkVersion() {
    try {
      const res = await fetch(VERSION_URL + '?t=' + Date.now());
      const data = await res.json();
      const latest = data[TOOL_KEY];
      if (latest && latest !== APP_VERSION) banner.style.display = 'block';
    } catch(e) {}
  }
  window.addEventListener('load', checkVersion);
})();
</script>
</body>
</html>
